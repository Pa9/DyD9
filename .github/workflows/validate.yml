name: Validar web

on:
  pull_request:
  push:
    branches:
      - feat/fase1-progresion-guiada

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Compilar aplicación
        run: npm run build
      - name: Comprobar lint
        run: npm run lint
