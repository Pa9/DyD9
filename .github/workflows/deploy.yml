name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare Pages artifact
        run: |
          mkdir -p dist-pages
          if [ -d .output/public ]; then
            cp -a .output/public/. dist-pages/
          elif [ -d dist/client ]; then
            cp -a dist/client/. dist-pages/
          else
            echo "No static output directory found"
            exit 1
          fi
          test -f dist-pages/index.html
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
